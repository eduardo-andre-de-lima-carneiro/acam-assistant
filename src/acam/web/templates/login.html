{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<div class="auth">
  <form class="card form" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <h1>Log in</h1>
    <p class="muted">Each user has a private workspace with their own research projects.</p>
    <label>Username <input name="username" autocomplete="username" autocapitalize="none" required autofocus></label>
    <label>Password <input name="password" type="password" autocomplete="current-password" required></label>
    <button class="btn btn-primary btn-block" type="submit">Log in</button>
    {% if signup_open %}
    <p class="small muted center">No account? <a href="{{ url_for('signup') }}">Create one</a></p>
    {% endif %}
  </form>
</div>
{% endblock %}
